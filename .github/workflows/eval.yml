name: RAG evaluation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full run with the LLM judge, at 03:17 IST — well apart from hr-agent-eval's
    # 08:07 IST run, which shares the same free Groq quota.
    - cron: "47 21 * * *"
  workflow_dispatch:
    inputs:
      prompt_version:
        description: "Prompt version to evaluate (v2, v1_naive)"
        default: "v2"

jobs:
  unit-tests:
    name: Unit tests (offline)
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: stub
      EMBEDDING_BACKEND: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-core.txt
      - run: pytest -m "not llm" -q

  quality-gate:
    name: LLM quality gate
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      LLM_PROVIDER: groq
      EMBEDDING_BACKEND: sentence-transformers
      PROMPT_VERSION: ${{ github.event.inputs.prompt_version || 'v2' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip when no API key is configured
        if: env.GROQ_API_KEY == ''
        run: echo "::notice::Add a GROQ_API_KEY repository secret to enable the LLM quality gate."
      - uses: actions/setup-python@v5
        if: env.GROQ_API_KEY != ''
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies (CPU-only torch)
        if: env.GROQ_API_KEY != ''
        run: pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt
      - name: Build the vector index
        if: env.GROQ_API_KEY != ''
        run: PYTHONPATH=src python -m bankrag.ingest
      - name: Run evaluation and release gate
        if: env.GROQ_API_KEY != ''
        # The LLM judge is expensive on the free tier, so pushes and pull requests run the
        # deterministic checks only; the nightly (and manual) run adds the faithfulness judge.
        run: PYTHONPATH=src:. python -m evals.run_eval $JUDGE_ARGS
        env:
          JUDGE_ARGS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--metrics faithfulness' || '--no-judge' }}
      - name: Publish report to the job summary
        if: always() && env.GROQ_API_KEY != ''
        run: test -f reports/latest.md && cat reports/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Refresh README with the latest results
        # Only full runs (nightly or manual) include the judge, so only they refresh the README.
        if: always() && env.GROQ_API_KEY != '' && github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: |
          test -f reports/latest.json || exit 0
          git fetch -q origin eval-reports:refs/remotes/origin/eval-reports 2>/dev/null \
            && git show origin/eval-reports:latest.json > "$RUNNER_TEMP/previous.json" 2>/dev/null || true
          PYTHONPATH=src:. python -m evals.update_readme reports/latest.json --previous "$RUNNER_TEMP/previous.json"
          if ! git diff --quiet README.md; then
            # Committed under the repo owner's identity so the bot doesn't appear as a contributor.
            git config user.name "Shivam Tayal"
            git config user.email "71970833+byshivam@users.noreply.github.com"
            git add README.md
            git commit -qm "Update latest evaluation results [skip ci]"
            git pull -q --rebase origin main
            git push -q origin HEAD:main
          fi
      - name: Save report history to the eval-reports branch
        if: always() && env.GROQ_API_KEY != '' && github.ref == 'refs/heads/main'
        run: |
          test -f reports/latest.json || exit 0
          cp reports/latest.md reports/latest.json "$RUNNER_TEMP/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin eval-reports >/dev/null; then
            git fetch -q origin eval-reports && git checkout -q -f eval-reports
          else
            git checkout -q --orphan eval-reports && git rm -rfq .
          fi
          stamp=$(date -u +%Y%m%d-%H%M%S)
          mkdir -p runs
          cp "$RUNNER_TEMP/latest.md" latest.md
          cp "$RUNNER_TEMP/latest.json" latest.json
          cp "$RUNNER_TEMP/latest.json" "runs/$stamp-$PROMPT_VERSION.json"
          git add latest.md latest.json runs
          git commit -qm "Eval report $stamp (prompt $PROMPT_VERSION)"
          git push -q origin eval-reports
      - uses: actions/upload-artifact@v4
        if: always() && env.GROQ_API_KEY != ''
        with:
          name: eval-report-${{ env.PROMPT_VERSION }}
          path: reports/latest.*
