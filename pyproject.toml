[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bankrag"
version = "0.1.0"
description = "A banking RAG assistant and the evaluation suite that keeps it honest."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
    "llm: needs a real LLM (GROQ_API_KEY); skipped otherwise",
]
